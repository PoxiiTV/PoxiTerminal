<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#121833"/>
      <stop offset="1" stop-color="#1c1236"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1ff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d6ff"/>
    </linearGradient>
    <mask id="prompt-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="white"/>
      <path d="M58 34L72 47L58 60" fill="none" stroke="black" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#glowA)"/>
  <rect width="1600" height="560" fill="url(#glowB)"/>
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/>
    <path d="M100 0V560M200 0V560M300 0V560M400 0V560M500 0V560M600 0V560M700 0V560M800 0V560M900 0V560M1000 0V560M1100 0V560M1200 0V560M1300 0V560M1400 0V560M1500 0V560"/>
  </g>

  <!-- Icono -->
  <g transform="translate(96 108)" filter="url(#shadow)">
    <rect width="150" height="150" rx="40" fill="url(#tile)"/>
    <g transform="translate(22 22) scale(0.828)">
      <path d="M36 14H70C93 14 110 29 110 47C110 65 93 80 70 80H54V102C54 108 49 114 42 114H36C29 114 24 108 24 102V26C24 19 29 14 36 14Z" fill="#0d1226" mask="url(#prompt-cut)"/>
      <path d="M70 104H100" fill="none" stroke="#0d1226" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Texto -->
  <text x="96" y="352" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="84" fill="url(#title)" letter-spacing="-1">PoxiTerminal</text>
  <text x="100" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#b8c4e6">Terminal acelerado por GPU para Windows,</text>
  <text x="100" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#b8c4e6">todo en <tspan fill="#4fd1ff" font-weight="600">castellano</tspan>.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#e8ecff">
    <rect x="100" y="478" width="118" height="36" rx="18" fill="#4fd1ff" fill-opacity="0.14" stroke="#4fd1ff" stroke-opacity="0.5"/>
    <text x="159" y="502" text-anchor="middle">SSH · SFTP</text>
    <rect x="230" y="478" width="138" height="36" rx="18" fill="#a06bff" fill-opacity="0.14" stroke="#a06bff" stroke-opacity="0.5"/>
    <text x="299" y="502" text-anchor="middle">Paneles</text>
    <rect x="380" y="478" width="172" height="36" rx="18" fill="#34e0a1" fill-opacity="0.14" stroke="#34e0a1" stroke-opacity="0.5"/>
    <text x="466" y="502" text-anchor="middle">Claude · Codex</text>
  </g>

  <!-- Ventana de terminal -->
  <g transform="translate(760 70)" filter="url(#shadow)">
    <rect width="760" height="420" rx="18" fill="#0d1226" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.10"/>
    <path d="M0 18a18 18 0 0 1 18-18h724a18 18 0 0 1 18 18v34H0z" fill="#ffffff" fill-opacity="0.05"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
      <rect x="18" y="12" width="150" height="30" rx="8" fill="#ffffff" fill-opacity="0.09"/>
      <text x="40" y="32" fill="#e8ecff">PowerShell</text>
      <text x="190" y="32" fill="#8f9bc4">servidor (SSH)</text>
      <text x="340" y="32" fill="#8f9bc4">claude</text>
    </g>
    <circle cx="690" cy="27" r="6" fill="#ffb454"/>
    <circle cx="712" cy="27" r="6" fill="#34e0a1"/>
    <circle cx="734" cy="27" r="6" fill="#ff6e8a"/>
    <path d="M380 52V420" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="Cascadia Mono, Consolas, monospace" font-size="17">
      <text x="24" y="92"><tspan fill="#4fd1ff">PS</tspan><tspan fill="#a06bff"> C:\Poxi</tspan><tspan fill="#e8ecff">&gt; git status</tspan></text>
      <text x="24" y="120" fill="#8f9bc4">En la rama main</text>
      <text x="24" y="148" fill="#34e0a1">+ README.md</text>
      <text x="24" y="176" fill="#ffb454">~ src/main.rs</text>
      <text x="24" y="218"><tspan fill="#4fd1ff">PS</tspan><tspan fill="#a06bff"> C:\Poxi</tspan><tspan fill="#e8ecff">&gt; ssh servidor</tspan></text>
      <text x="24" y="246" fill="#34e0a1">✔ Conectado</text>
      <text x="24" y="288"><tspan fill="#4fd1ff">PS</tspan><tspan fill="#a06bff"> C:\Poxi</tspan><tspan fill="#e8ecff">&gt; </tspan><tspan fill="#e8ecff" opacity="0.8">█</tspan></text>

      <text x="404" y="92" fill="#a06bff">● claude</text>
      <text x="404" y="120" fill="#e8ecff">Revisando el proyecto…</text>
      <text x="404" y="148" fill="#8f9bc4">3 archivos cambiados</text>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="404" y="296" width="336" height="100" rx="14" fill="#171e3d" stroke="#a06bff" stroke-opacity="0.5"/>
      <text x="424" y="330" font-size="17" font-weight="600" fill="#e8ecff">Turno terminado</text>
      <text x="424" y="358" font-size="15" fill="#b8c4e6">Claude ha terminado. Revisa el</text>
      <text x="424" y="380" font-size="15" fill="#b8c4e6">terminal para ver el resultado.</text>
    </g>
  </g>
</svg>
